name: 安全检查

# 这份文件的前一版有 329 行、十二项 grep 检查，但它几乎不会失败：
#
#   - ESLint 那一步结尾挂着 `|| true`，而且 eslint 根本不在依赖里（npx 会现去
#     registry 下载），用的 --no-eslintrc 在 ESLint 9 已经被移除
#   - gitleaks 那一步也挂着 `|| true`
#   - 十二项 grep 只在 pull_request 事件上 exit 1；推到自己分支时一律只警告
#   - 那个「i18n 合规」检查按**每个中文字符**打印一行警告，行号还全取第一个字符
#     的位置。本项目的注释就是中文的，于是它每次输出 21680 行一模一样的话
#
# 一个不会失败的检查不是检查，一个每次吐两万行的检查没有人会读。所以这一版只留
# 四件**会拦下合并**的事，每一件都能说清楚拦的是什么。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: 密钥泄漏
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 扫全部历史，不只是工作树。密钥最常见的泄漏方式是「提交了，发现了，
          # 下一个提交删掉」—— 工作树是干净的，历史里那份仍然人人可取。
          fetch-depth: 0

      - name: gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # 不加 `|| true`：发现密钥就让这个 job 红。--redact 保证日志里不会
          # 把泄漏的值再印一遍 —— Actions 日志对任何能看见仓库的人都是公开的。
          ./gitleaks detect --source . --redact --verbose

  deps:
    name: 依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 许可证相容性。
      #
      # 本项目以 AGPL-3.0 分发，是 copyleft：混进一个不相容的依赖，不是「有个
      # 警告」，是整个分发行为失去许可。而这种错误不会让构建失败、不会让测试
      # 变红、装出来的包跑得好好的 —— 只有专门去查才看得见。
      - name: 许可证相容性
        run: node scripts/check-licenses.mjs

      # 只管会进 APK 的那些。构建工具的漏洞影响的是构建机，不是用户的平板，
      # 而把它们算进来会让这一步长期红着，然后被人加上 `|| true`。
      - name: 已知漏洞
        run: npm audit --omit=dev --audit-level=high

      # 依赖预算。
      #
      # 「依赖尽量少」在 SECURITY.md 里是写进设计约束的一条，但写在文档里的约束
      # 会慢慢失效。定一个数，越过了就停下来说一句 —— 不是禁止加依赖，是不许
      # 无声地加。
      - name: 依赖预算
        run: |
          set -euo pipefail
          COUNT=$(node -p 'Object.keys(require("./package.json").dependencies || {}).length')
          echo "运行时依赖 $COUNT 个"
          if [ "$COUNT" -gt 8 ]; then
            echo "::error::运行时依赖涨到 $COUNT 个了（上限 8）。要么去掉一个，要么改掉这里的上限并在提交信息里说明为什么。"
            exit 1
          fi

  source:
    name: 源码
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 动态执行。
      #
      # 这个 app 把外来的 PDF 喂给 pdf.js 在 WebView 里渲染，自己这一侧就不该
      # 再留任何「把字符串当代码跑」的入口。现在一处都没有，所以这条检查的门槛
      # 可以定在零 —— 门槛定在零的检查才有意义，定在「不超过几处」的会慢慢涨。
      - name: 不许把字符串当代码执行
        run: |
          set -euo pipefail
          PATTERN='\beval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|(setTimeout|setInterval)[[:space:]]*\([[:space:]]*["'"'"']'
          # 只查自己写的。public/vendor/ 是 pdf.js 的打包产物，它内部怎么写不归
          # 这里管，也改不动。
          if git grep -nE "$PATTERN" -- src index.html public/sw.js scripts; then
            echo "::error::源码里出现了动态执行。要么改掉，要么在这里写明为什么这一处是安全的。"
            exit 1
          fi
          echo "没有"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 测试套件本身就是最大的一道防线：i18n 漏键、笔迹层装卸、对题引擎拒答，
      # 这些都有断言在管。与其在 CI 里另写一套 grep 去猜，不如把它跑绿。
      - name: 测试
        run: npm test
