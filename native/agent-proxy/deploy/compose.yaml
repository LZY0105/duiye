services:
  agent-proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      DUIYE_AGENT_LISTEN_HOST: 0.0.0.0
    restart: unless-stopped
    expose:
      - "8787"
    networks:
      - agent-internal

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      - agent-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - agent-internal

networks:
  agent-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
