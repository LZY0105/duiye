<!DOCTYPE html>

<head>

  <!-- Tablet: the page itself must not zoom. Pinch belongs to the PDF pane, which
       handles it explicitly; browser page-zoom on top of that gives two zooms
       fighting over one gesture, and double-tap-to-zoom steals the second tap of
       a double tap on a tool. `interactive-widget` keeps the workspace from
       being resized out from under a stylus when a keyboard appears. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 练习：两栏并排的 PDF 工作区。

         它和依赖的那套识别栈一起删掉了，那一行注释却留到了现在。 -->
    <div class="page" id="page-pdf">
      <!-- The import row and the dock are put away by swiping them off, and
           brought back by swiping down from the top edge or up from the bottom.
           There was a chevron in the corner that did the same thing; it was the
           only control on this screen with nothing to do with reading, it sat
           over the page it was making room for, and once the gesture worked
           reliably at both edges nobody was going to aim at a 30px circle. -->
      <div class="pdf-page-bar">

               before any PDF has been opened. -->
          <button type="button" class="pdf-bar-btn is-accent" data-role="new-scratch" data-i18n="note.new">新建纸张</button>

  <!-- ═══ Liquid Glass refraction filter ═══
       Real glass does not just blur what is behind it, it bends it: the
       backdrop shifts sideways near the rim, where the curve is steepest, and
       stays put through the flat middle. CSS `backdrop-filter: blur()` only
       scatters, which is why a dragged capsule used to slide over text without
       disturbing it.

       This is the displacement-map approach: a map image whose red channel
       carries the horizontal offset and whose green channel carries the
       vertical one, both neutral (128) across the centre and ramping to the
       extremes at the edges, so `feDisplacementMap` bends the backdrop only
       near the rim. The two ramps are combined with a screen blend, which
       leaves red from one and green from the other.

       It is applied only while a capsule is being dragged (see material.css),
       because that is when the bending is legible and because it is the most
       expensive filter in the app. `@supports` keeps it to engines that can
       actually run an SVG filter as a backdrop — Chromium, which is what the
       Android WebView this ships in uses. Everywhere else the plain blur in
       the same declaration stands. -->
  <svg class="lg-filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="lg-refract" x="0%" y="0%" width="100%" height="100%"
              color-interpolation-filters="sRGB">
        <feImage preserveAspectRatio="none" result="map" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27100%27 height=%27100%27%3E%3Cdefs%3E%3ClinearGradient id=%27x%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%270%27%3E%3Cstop offset=%270%27 stop-color=%27rgb(0,0,0)%27/%3E%3Cstop offset=%270.18%27 stop-color=%27rgb(128,0,0)%27/%3E%3Cstop offset=%270.82%27 stop-color=%27rgb(128,0,0)%27/%3E%3Cstop offset=%271%27 stop-color=%27rgb(255,0,0)%27/%3E%3C/linearGradient%3E%3ClinearGradient id=%27y%27 x1=%270%27 y1=%270%27 x2=%270%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27rgb(0,0,0)%27/%3E%3Cstop offset=%270.18%27 stop-color=%27rgb(0,128,0)%27/%3E%3Cstop offset=%270.82%27 stop-color=%27rgb(0,128,0)%27/%3E%3Cstop offset=%271%27 stop-color=%27rgb(0,255,0)%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%27100%27 height=%27100%27 fill=%27url(%23x)%27/%3E%3Crect width=%27100%27 height=%27100%27 fill=%27url(%23y)%27 style=%27mix-blend-mode:screen%27/%3E%3C/svg%3E" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="34"
                           xChannelSelector="R" yChannelSelector="G" result="bent" />
        <!-- A touch of blur hides the map's quantisation; the saturation bump is
             the vibrancy that light picks up passing through the glass. -->
        <feGaussianBlur in="bent" stdDeviation="0.7" result="soft" />
        <feColorMatrix in="soft" type="saturate" values="1.7" />
      </filter>

      <!-- The same lens, gentler. `scale` is in pixels, so the 34px offset above
           is right for a capsule a few hundred pixels wide and absurd on a 72px
           segmented-control pill, where it would fold the backdrop over itself.
           This one is sized for small chrome. -->
      <filter id="lg-refract-soft" x="0%" y="0%" width="100%" height="100%"
              color-interpolation-filters="sRGB">
        <feImage preserveAspectRatio="none" result="map" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27100%27 height=%27100%27%3E%3Cdefs%3E%3ClinearGradient id=%27x%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%270%27%3E%3Cstop offset=%270%27 stop-color=%27rgb(0,0,0)%27/%3E%3Cstop offset=%270.22%27 stop-color=%27rgb(128,0,0)%27/%3E%3Cstop offset=%270.78%27 stop-color=%27rgb(128,0,0)%27/%3E%3Cstop offset=%271%27 stop-color=%27rgb(255,0,0)%27/%3E%3C/linearGradient%3E%3ClinearGradient id=%27y%27 x1=%270%27 y1=%270%27 x2=%270%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27rgb(0,0,0)%27/%3E%3Cstop offset=%270.22%27 stop-color=%27rgb(0,128,0)%27/%3E%3Cstop offset=%270.78%27 stop-color=%27rgb(0,128,0)%27/%3E%3Cstop offset=%271%27 stop-color=%27rgb(0,255,0)%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%27100%27 height=%27100%27 fill=%27url(%23x)%27/%3E%3Crect width=%27100%27 height=%27100%27 fill=%27url(%23y)%27 style=%27mix-blend-mode:screen%27/%3E%3C/svg%3E" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="15"
                           xChannelSelector="R" yChannelSelector="G" result="bent" />
        <!-- Transmission only. A brightness lift lived here briefly and had to
             go: this app's backdrop is a near-white page ruled with 4.5%-alpha
             grid lines, and lifting it 6% erased exactly the detail the lens
             exists to bend. Whatever is behind the pill comes through at its
             own value, a little more saturated, and nothing else. Purity here
             is subtraction — the pill has no fill, no wash and no lift, so what
             you see through it is the page. -->
        <feColorMatrix in="bent" type="saturate" values="1.25" />
      </filter>
    </defs>
  </svg>

  <!-- 第三方库，钉在仓库里，不走 CDN -->
  <!-- No ONNX Runtime script here. It referenced /vendor/ort.all.min.js, a
       file that has never existed in this repository: not in public/vendor,
       not in dist, not in the Android assets, and never tracked in git. The
       dev server answered the request with its HTML fallback, so the browser
       parsed a '<' as JavaScript and reported SyntaxError on every load, and
       the production build warned it could not bundle the reference.
       Nothing consumes it — no module imports onnxruntime-web and no code
       touches an `ort` global; recognition runs through the native Capacitor
       bridge in src/ocr/ocr-native.js. The tag is a leftover from the removed
       browser-side inference path. If that path returns, restore this tag AND
       vendor the pinned runtime into public/vendor so dev, dist and Android
       all serve it. -->
  <script src="/vendor/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.js';
  </script>


  <!-- The Liquid Glass skin used to inject an SVG <defs> block of five filters
       here — displacement lenses, Sobel normal maps and specular point lights.
       None of them survived, and none is referenced any more.

       They could not do the job they were written for. A displacement lens
       needs a normal map, and every one of these derived its map from
       `SourceAlpha`. Inside `backdrop-filter` the input is the backdrop image,
       which is uniformly opaque, so there was no alpha edge to read and
       nothing bent. Applied as `filter` instead — which is how the ink toolbar
       used one — the map came from the element's own shape, so it warped the
       element's own icons and left the scene behind it untouched: the opposite
       of refraction, at the cost of two per-pixel convolution passes per frame
       on the surface floating over the inking canvas.

       The rim, the Fresnel falloff, the catchlight and the dispersion fringe
       are all in CSS now, in base.css and ink-toolbar.css, driven by the
       --glass-x / --glass-y / --glass-angle custom properties that
       src/ui/liquid-glass.js keeps on the pointer. -->


  <!-- 入口 -->
  <script type="module" src="/src/main.js"></script>
