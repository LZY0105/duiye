apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'com.latexsnipper.llamaruntime'
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = '29.0.13113456'

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                    '-DCMAKE_MESSAGE_LOG_LEVEL=STATUS',
                    '-DBUILD_SHARED_LIBS=ON',
                    '-DLLAMA_BUILD_APP=OFF',
                    '-DLLAMA_BUILD_COMMON=ON',
                    '-DLLAMA_OPENSSL=OFF',
                    '-DLLAMA_CURL=OFF',
                    '-DGGML_NATIVE=OFF',
                    '-DGGML_BACKEND_DL=ON',
                    '-DGGML_CPU_ALL_VARIANTS=ON',
                    '-DGGML_LLAMAFILE=OFF'
            }
        }
        aarMetadata {
            minCompileSdk = 35
        }
    }

    externalNativeBuild {
        cmake {
            path file('../third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            java.srcDir '../third_party/llama.cpp/examples/llama.android/lib/src/main/java'
            java.exclude 'com/arm/aichat/gguf/**'
            java.exclude 'com/arm/aichat/internal/gguf/**'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
