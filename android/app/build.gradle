apply plugin: 'com.android.application'

// Load keystore properties from environment (CI) or local file
def keystoreProperties = new Properties()
def keystoreFile = file('release.keystore')
def keystorePropsFile = file('keystore.properties')

if (keystorePropsFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropsFile))
} else if (System.getenv('KEYSTORE_PASSWORD') != null) {
    // CI: use environment variables (GitHub Secrets)
    keystoreProperties['storeFile'] = 'release.keystore'
    keystoreProperties['storePassword'] = System.getenv('KEYSTORE_PASSWORD')
    keystoreProperties['keyAlias'] = System.getenv('KEY_ALIAS') ?: 'latexsnipper'
    keystoreProperties['keyPassword'] = System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
}

// 版本号从 package.json 读，而不是在这里另抄一份。
//
// 这两处本来各写各的：package.json 与「关于」页里是 1.3.0，而这里一直停在 1.0。
// 也就是说至今装出去的每一个 APK，向 Android 报告的版本都是 1.0——而系统正是用
// 这个数字判断一次安装是升级还是降级，所以它错了，覆盖安装也就无从谈起。
//
// versionCode 必须是递增的整数，按 主*10000 + 次*100 + 修订 折算：1.3.0 → 10300。
// 这个式子对任何合理的版本号都单调递增，也就不会再出现装不上去的情况。
def appVersion = new groovy.json.JsonSlurper()
        .parse(file("$rootDir/../package.json")).version as String
def semver = appVersion.tokenize('.').collect { (it =~ /^\d+/)[0] as int }
def appVersionCode = semver[0] * 10000 + (semver.size() > 1 ? semver[1] : 0) * 100 +
        (semver.size() > 2 ? semver[2] : 0)

android {
    namespace = "com.latexsnipper.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.latexsnipper.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // V1+V2+V3+V4 signing
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    // No ABI splits. They sliced the native libraries of the recognition stack;
    // with that gone the app ships no native code of its own, and the four
    // architecture APKs came out byte-for-byte identical — same sha256, four
    // uploads, and a release page asking the reader to choose between copies of
    // one file. If native code returns, so should this block.
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
