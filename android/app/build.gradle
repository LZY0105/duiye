apply plugin: 'com.android.application'

// Load keystore properties from environment (CI) or local file
def keystoreProperties = new Properties()
def keystoreFile = file('release.keystore')
def keystorePropsFile = file('keystore.properties')

if (keystorePropsFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropsFile))
} else if (System.getenv('KEYSTORE_PASSWORD') != null) {
    // CI: use environment variables (GitHub Secrets)
    keystoreProperties['storeFile'] = 'release.keystore'
    keystoreProperties['storePassword'] = System.getenv('KEYSTORE_PASSWORD')
    keystoreProperties['keyAlias'] = System.getenv('KEY_ALIAS') ?: 'latexsnipper'
    keystoreProperties['keyPassword'] = System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
}

// 版本号从 package.json 读，而不是在这里另抄一份。
//
// 这两处本来各写各的：package.json 与「关于」页里是 1.3.0，而这里一直停在 1.0。
// 也就是说至今装出去的每一个 APK，向 Android 报告的版本都是 1.0——而系统正是用
// 这个数字判断一次安装是升级还是降级，所以它错了，覆盖安装也就无从谈起。
//
// versionCode 必须是递增的整数，按 主*10000 + 次*100 + 修订 折算：1.3.0 → 10300。
// 这个式子对任何合理的版本号都单调递增，也就不会再出现装不上去的情况。
def appVersion = new groovy.json.JsonSlurper()
        .parse(file("$rootDir/../package.json")).version as String
def semver = appVersion.tokenize('.').collect { (it =~ /^\d+/)[0] as int }
def appVersionCode = semver[0] * 10000 + (semver.size() > 1 ? semver[1] : 0) * 100 +
        (semver.size() > 2 ? semver[2] : 0)

android {
    namespace = "com.latexsnipper.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.latexsnipper.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // 原生代理层（src/main/cpp）。现在编出来的是一座桥加两个空位，里面没有
        // 任何模型，也没有任何识别引擎——但它是真编、真装进 APK、JS 真能问到的。
        // 一份从来没编译过的接口和一份不存在的接口是一回事。
        // 不关异常、不关 RTTI。这一层的全部用途就是以后往里插别人的东西——
        // 模型运行时、识别引擎、JSON 库，它们大多要用异常；-fno-rtti 还会让
        // dynamic_cast 不能用。为一个几十 KB 的桥省那点体积，换来的是接入方
        // 第一天就得先来改这一行。另外 std::thread 和 make_shared 本身会抛，
        // 关掉异常的话它们失败时直接 terminate，等于内存紧张时崩给用户看。
        //
        // STL 仍然是静态的：现在整个 APK 里只有这一个 .so，静态链接正是这种
        // 情形该用的。接入方加进来第二个 .so 的那一天要改成 c++_shared——两个
        // 库各带一份 libc++ 的话，异常跨不过库的边界，而那种毛病查起来要命。
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }
        // 四个架构全带上会让 APK 多出三份用不上的库。这台设备和绝大多数现役
        // 平板都是 arm64；32 位那份留着是因为还有在用的老机器，x86_64 是模拟器
        // 要用的。接入方要是加了大体积的第三方库，该回来重看这一行。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // V1+V2+V3+V4 signing
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    // 仍然不切 ABI 包。
    //
    // 上面那段注释原来写着「本 app 不含任何原生代码，所以四个架构的 APK 字节
    // 完全一样」——现在含了，那句话不再成立，但结论还成立：代理层的 .so 只有
    // 几十 KB，切成四个包省下来的比一个发布页让人挑架构的代价小得多。真接上
    // 模型之后（那才是几十上百兆）该回来重看这一段。
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
