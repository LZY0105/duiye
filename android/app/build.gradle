apply plugin: 'com.android.application'

// 签名材料从哪里来。
//
// 两个来源，本地文件优先：
//   keystore.properties  —— 本机开发用，被 .gitignore 拦着，永远不进仓库
//   环境变量             —— CI 用，值来自仓库 Secret
//
// 找不到就留空。留空不是错误：debug 构建根本不需要它，assembleRelease 也能跑完
// （下面 signingConfig 那一句会跳过），只是产出一个没签名、装不上去的包。要让
// 它在没有密钥时直接报错听起来更严谨，但那会让「只想编译一下看看有没有语法错」
// 这件事也必须先有密钥。
def signing = new Properties()
def signingPropsFile = file('keystore.properties')

if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signing.load(it) }
} else if (System.getenv('KEYSTORE_PASSWORD')) {
    def pwd = System.getenv('KEYSTORE_PASSWORD')
    signing.putAll([
        storeFile    : 'release.keystore',
        storePassword: pwd,
        keyAlias     : System.getenv('KEY_ALIAS') ?: 'duiye',
        keyPassword  : System.getenv('KEY_PASSWORD') ?: pwd,
    ])
}

// 密钥齐不齐，只判断一次，下面两处都用它。
// 原来那个判断写了两遍，一处在 signingConfigs、一处在 buildTypes.release；
// 两处都只看 storeFile 在不在，于是一份缺了口令的 properties 能过第一关，
// 到 Gradle 真去开密钥库时才炸，报的是 keystore password was incorrect。
def canSign = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .every { signing[it] }

// 版本号从 package.json 读，而不是在这里另抄一份。
//
// 这两处本来各写各的：package.json 与「关于」页里是 1.3.0，而这里一直停在 1.0。
// 也就是说至今装出去的每一个 APK，向 Android 报告的版本都是 1.0——而系统正是用
// 这个数字判断一次安装是升级还是降级，所以它错了，覆盖安装也就无从谈起。
//
// versionCode 必须是递增的整数，按 主*10000 + 次*100 + 修订 折算：1.3.0 → 10300。
// 这个式子对任何合理的版本号都单调递增，也就不会再出现装不上去的情况。
def appVersion = new groovy.json.JsonSlurper()
        .parse(file("$rootDir/../package.json")).version as String
def semver = appVersion.tokenize('.').collect { (it =~ /^\d+/)[0] as int }
def appVersionCode = semver[0] * 10000 + (semver.size() > 1 ? semver[1] : 0) * 100 +
        (semver.size() > 2 ? semver[2] : 0)

android {
    namespace = "io.github.lzy0105.duiye"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.lzy0105.duiye"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // 原生代理层（src/main/cpp）。现在编出来的是一座桥加两个空位，里面没有
        // 任何模型，也没有任何识别引擎——但它是真编、真装进 APK、JS 真能问到的。
        // 一份从来没编译过的接口和一份不存在的接口是一回事。
        // 不关异常、不关 RTTI。这一层的全部用途就是以后往里插别人的东西——
        // 模型运行时、识别引擎、JSON 库，它们大多要用异常；-fno-rtti 还会让
        // dynamic_cast 不能用。为一个几十 KB 的桥省那点体积，换来的是接入方
        // 第一天就得先来改这一行。另外 std::thread 和 make_shared 本身会抛，
        // 关掉异常的话它们失败时直接 terminate，等于内存紧张时崩给用户看。
        //
        // STL 仍然是静态的：现在整个 APK 里只有这一个 .so，静态链接正是这种
        // 情形该用的。接入方加进来第二个 .so 的那一天要改成 c++_shared——两个
        // 库各带一份 libc++ 的话，异常跨不过库的边界，而那种毛病查起来要命。
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }
        // 四个架构全带上会让 APK 多出三份用不上的库。这台设备和绝大多数现役
        // 平板都是 arm64；32 位那份留着是因为还有在用的老机器，x86_64 是模拟器
        // 要用的。接入方要是加了大体积的第三方库，该回来重看这一行。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']

                // 签名方案：V2 起步。
                //
                // V1 是 JAR 签名，只有 Android 7.0 以前的系统会去读它。这个 app
                // 的 minSdk 是 30，装得上它的设备一台也不会看 V1——留着它只是让
                // 每次发布构建多算一遍全量摘要，并往 APK 里塞一份 META-INF。
                // （关掉的代价是它装不到 Android 7 以下，而那本来就装不上。）
                enableV1Signing false
                enableV2Signing true      // API 24+，整包摘要
                enableV3Signing true      // API 28+，支持密钥轮换
                enableV4Signing true      // API 31+，adb 增量安装用，另出 .idsig
            }
        }
    }

    buildTypes {
        // debug 留空：它用 Android 自带的调试密钥，不混淆、可调试，都是默认值。
        // 空块比没有块好——它让「这里是故意什么都不改」这件事写在脸上。
        debug {
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 没有密钥就不挂签名配置。挂了会让 Gradle 在打包时才发现开不了
            // 密钥库，而那时候 R8 已经跑完了——几分钟的等待换一句本可以在第一秒
            // 说出口的话。
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    // 仍然不切 ABI 包。
    //
    // 上面那段注释原来写着「本 app 不含任何原生代码，所以四个架构的 APK 字节
    // 完全一样」——现在含了，那句话不再成立，但结论还成立：代理层的 .so 只有
    // 几十 KB，切成四个包省下来的比一个发布页让人挑架构的代价小得多。真接上
    // 模型之后（那才是几十上百兆）该回来重看这一段。
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
