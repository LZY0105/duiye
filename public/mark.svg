<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="对页">
  <title>对页</title>
  <!--
    The same mark at UI size, drawn in currentColor so it takes the accent from
    whatever it sits in. Redrawn rather than scaled: at 24px the 512-grid
    proportions go muddy, so the pages are wider, the seam is tighter, and the
    notch is a third of the page height instead of a tenth.
  -->
  <defs>
    <mask id="mark-notch">
      <rect width="24" height="24" fill="#fff"/>
      <circle cx="11" cy="12" r="2.1" fill="#000"/>
    </mask>
  </defs>
  <rect x="2.5" y="4.5" width="8.5" height="15" rx="1.9" fill="currentColor" mask="url(#mark-notch)"/>
  <g fill="currentColor">
    <rect x="13" y="4.5" width="8.5" height="15" rx="1.9"/>
    <circle cx="13" cy="12" r="2.1"/>
  </g>
</svg>
